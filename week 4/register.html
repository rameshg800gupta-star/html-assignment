
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Coding Club Events and Registration">
    <meta name="author" content="Coding Club">

    <title>Coding Club - Register</title>

    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
</head>

<body>

    <!-- Navigation Menu -->
    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="register.html">Register</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <header>
        <h1>Coding Club</h1>
    </header>

    <main>

        <!-- Events Section -->
        <section id="events">

            <h2>Upcoming Events</h2>

            <table border="1">

                <caption>Club Events</caption>

                <thead>
                    <tr>
                        <th>Event</th>
                        <th>Date</th>
                        <th>Venue</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>HTML Workshop</td>
                        <td>12 Nov</td>
                        <td>Lab 1</td>
                    </tr>

                    <tr>
                        <td>Hackathon</td>
                        <td>20 Nov</td>
                        <td>Seminar Hall</td>
                    </tr>
                </tbody>

                <tfoot>
                    <tr>
                        <td colspan="3">Total events: 2</td>
                    </tr>
                </tfoot>

            </table>

        </section>

        <!-- Registration Form -->
        <section id="register">

            <h2>Register</h2>

            <form action="#" method="post">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name"
                       placeholder="Your name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password"
                       name="password" required>
                <br><br>

                <label for="dob">Date of birth:</label>
                <input type="date" id="dob" name="dob">
                <br><br>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
                <br><br>

                <!-- Radio Buttons -->
                Gender:

                <input type="radio" id="male"
                       name="gender" value="Male">
                <label for="male">Male</label>

                <input type="radio" id="female"
                       name="gender" value="Female">
                <label for="female">Female</label>

                <br><br>

                <!-- Checkboxes -->
                Interests:

                <input type="checkbox" id="web"
                       name="interests" value="Web">
                <label for="web">Web</label>

                <input type="checkbox" id="dsa"
                       name="interests" value="DSA">
                <label for="dsa">DSA</label>

                <br><br>

                <!-- Dropdown -->
                <label for="branch">Branch:</label>

                <select id="branch" name="branch">
                    <option value="BCA">BCA</option>
                    <option value="BTech">BTech</option>
                    <option value="MCA">MCA</option>
                    <option value="Other">Other</option>
                </select>

                <br><br>

                <!-- Textarea -->
                <label for="message">
                    Why do you want to join?
                </label>

                <br>

                <textarea id="message" name="message"
                          rows="4" cols="35"></textarea>

                <br><br>

                <button type="submit">Register</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Coding Club. All rights reserved.</p>
    </footer>

</body>
</html>
