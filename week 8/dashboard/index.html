
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Dashboard</title>

    <!-- CSS File Linking -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <h1>My Dashboard</h1>
        </header>

        <!-- Sidebar Menu -->
        <aside class="sidebar">

            <h2>Menu</h2>

            <ul>
                <li>Home</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>

        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <div class="card">
                <span>👤</span>
                <h3>120</h3>
                <p>Users</p>
            </div>

            <div class="card">
                <span>💰</span>
                <h3>Rs 45k</h3>
                <p>Sales</p>
            </div>

            <div class="card">
                <span>📦</span>
                <h3>36</h3>
                <p>Orders</p>
            </div>

            <div class="card">
                <span>⭐</span>
                <h3>4.8</h3>
                <p>Rating</p>
            </div>

            <div class="card">
                <span>💬</span>
                <h3>18</h3>
                <p>Messages</p>
            </div>

            <div class="card">
                <span>✅</span>
                <h3>92%</h3>
                <p>Done</p>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <h3>Made with CSS Grid</h3>
        </footer>

    </div>

</body>
</html>
